# STANDALONE disposable compose — dual-network reach-compare template (post reach-1).
# Same image pins / pull_policy never / no scheduler as compose.pre-g5-snapshot-disposable.yaml.
#
# Networks:
#   preg5_net     internal:true  — postgres + api + web (DB mesh; no default external route on this net)
#   preg5_publish internal:false — api + web only (host publish path; see reach-compare egress disclosure)
#
# Host binds: 127.0.0.1 only (no 0.0.0.0). Does NOT authorize LIVE up without Trish EXECUTE + Dex ACCEPT.

name: theplan-pre-g5-disposable-template

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to local immutable sha256 id}
    pull_policy: never
    environment:
      POSTGRES_USER: preg5
      POSTGRES_PASSWORD: preg5_disposable_only
      POSTGRES_DB: theplan_preg5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preg5 -d theplan_preg5"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [preg5_net]
    volumes:
      - preg5_pgdata:/var/lib/postgresql/data

  api:
    image: ${SNAPSHOT_API_IMAGE:?set SNAPSHOT_API_IMAGE to reconstructed sha256 id}
    pull_policy: never
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PATH: /usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql+psycopg://preg5:preg5_disposable_only@postgres:5432/theplan_preg5
      SCHEDULE_DISPATCH: external
      SEED_DEMO_USER: "false"
      ASSIST_ENABLED: "false"
      SESSION_HTTPS_ONLY: "false"
      SESSION_SECRET: ${PREG5_SESSION_SECRET:?set disposable PREG5_SESSION_SECRET}
      TOKEN_ENCRYPTION_KEY: ${PREG5_TOKEN_ENCRYPTION_KEY:?set disposable PREG5_TOKEN_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:18000:8000"
    networks: [preg5_net, preg5_publish]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${SNAPSHOT_WEB_IMAGE:?set SNAPSHOT_WEB_IMAGE to reconstructed sha256 id}
    pull_policy: never
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:18080:80"
    networks: [preg5_net, preg5_publish]
    depends_on:
      - api

networks:
  preg5_net:
    driver: bridge
    internal: true
  preg5_publish:
    driver: bridge
    # non-internal bridge: api/web may use default masqueraded egress on this interface (Option B disclosure)

volumes:
  preg5_pgdata:
