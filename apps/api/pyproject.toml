[project]
name = "theplan-api"
version = "0.1.0"
description = "Personal task + scheduling API (Wave 0 scaffold)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.51",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.13",
    "pydantic-settings==2.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
