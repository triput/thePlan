[project]
name = "theplan-cli"
version = "0.1.0"
description = "Agent-friendly CLI for thePlan (local ops + API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1",
]

[project.scripts]
theplan = "theplan.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["theplan*"]
